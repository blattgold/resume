name: Test

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Node
        run: sudo apt-get update && sudo apt-get install -y nodejs

      - name: Install Npm Deps
        run: npm ci

      - name: install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Test
        run: npm run test
